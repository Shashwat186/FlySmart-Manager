name: Test Coverage

on:
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  coverage:
    name: JaCoCo coverage
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and generate coverage report
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Write line coverage to job summary
        run: |
          awk -F',' 'NR > 1 { missed += $8; covered += $9 }
            END {
              total = missed + covered
              pct = total > 0 ? 100 * covered / total : 0
              printf "## Test coverage\n\n**Line coverage:** %.2f%% (%d of %d lines)\n", pct, covered, total
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
